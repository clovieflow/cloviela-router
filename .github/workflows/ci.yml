# Cloviela CI: the gates a change has to pass.
#
# Runs on every push and pull request. The backend suite needs a real
# PostgreSQL — several of its cases exercise migrations and restore, which a
# mock cannot stand in for — so the job starts the runner's own PostgreSQL and
# Redis instead of pulling images. Redis is optional: a suite that needs it
# skips with an explicit reason when its URL is absent, so a runner without it
# still gets a meaningful result.
#
# What is NOT here, and why: the end-to-end browser matrix and the performance
# runs. Both need a live gateway with provider credentials and take long enough
# that they belong on a schedule rather than on every push. They are documented
# in documentation/release-evidence.md.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only the database URL is exported here. `CLOVIELA_TEST_REDIS_URL` is set by
# the step below *after* Redis is confirmed running: a suite that reads the
# variable concludes Redis is available, so exporting it unconditionally made
# the admission tests fail to connect instead of skipping with a reason.
env:
  CLOVIELA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cloviela_test

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Read from `.bun-version`, which is the file a contributor's
          # version manager already honours. "latest" tested a different Bun
          # than the Dockerfile builds with and the README asks for.
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run dashboard:typecheck

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Read from `.bun-version`, which is the file a contributor's
          # version manager already honours. "latest" tested a different Bun
          # than the Dockerfile builds with and the README asks for.
          bun-version-file: .bun-version

      # Started from the runner's own packages rather than as a service
      # container: a service container needs a Docker Hub pull, and the
      # anonymous pull quota is shared and easily exhausted — the job failed
      # twice on "toomanyrequests" without running a single test.
      - name: Start PostgreSQL and Redis
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          # Idempotent: a runner is clean, but a re-run of the same job must
          # not fail on "database already exists".
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'cloviela_test'" \
            | grep -q 1 || sudo -u postgres createdb cloviela_test
          pg_isready -h localhost -p 5432

          # Redis is installed rather than assumed. The runner ships the client
          # but not always the server, and the admission suites need a real one
          # to exercise their atomicity guarantees — skipping them would leave
          # the concurrency limits untested on every push.
          if ! command -v redis-server >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
          fi

          if command -v redis-server >/dev/null 2>&1; then
            sudo systemctl start redis-server || sudo systemctl start redis || redis-server --daemonize yes
            redis-cli ping
            # Exported only now, so the suites that need Redis run and the ones
            # that do not are unaffected.
            echo "CLOVIELA_TEST_REDIS_URL=redis://localhost:6379/15" >> "$GITHUB_ENV"
          else
            echo "Redis absent; suites that need it will skip with a reason."
          fi

      - run: bun install --frozen-lockfile
      - run: bun run test:backend

  dashboard:
    name: dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Read from `.bun-version`, which is the file a contributor's
          # version manager already honours. "latest" tested a different Bun
          # than the Dockerfile builds with and the README asks for.
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run dashboard:test
      - run: bun run dashboard:build

  build:
    name: build binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Read from `.bun-version`, which is the file a contributor's
          # version manager already honours. "latest" tested a different Bun
          # than the Dockerfile builds with and the README asks for.
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The whole point of the build job is that a release artefact can be
      # produced from a clean checkout — not only from the author's machine.
      - run: bun run build
