services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloviela-router:local
    ports:
      - "127.0.0.1:${PORT:-12800}:12800"
    # Keep credentials and URLs in .env; do not bake
    # database secrets or a database service into this application stack.
    # Docker defaults to full capabilities (external PostgreSQL + bundled
    # Redis); .env overrides both — set CLOVIELA_DB_MODE=lite for the
    # embedded database, or clear REDIS_URL for the in-memory backend.
    env_file:
      - "${CLOVIELA_ENV_FILE:-.env}"
    environment:
      NODE_ENV: production
      PORT: "12800"
      CLOVIELA_BIND_HOST: "0.0.0.0"
      DASHBOARD_DIST: /app/dist/dashboard
      CLOVIELA_DATA_DIR: /app/data
      CLOVIELA_DB_MODE: ${CLOVIELA_DB_MODE:-full}
      REDIS_URL: ${REDIS_URL-redis://redis:6379}
    depends_on:
      - redis
    volumes:
      # Lite database, install id, and payload captures live under /app/data;
      # without this mount a container replace wipes them.
      - cloviela-data:/app/data
    restart: unless-stopped
    networks:
      - cloviela

  # Redis is bundled for Docker's default full capabilities. Compose allows
  # REDIS_URL to be overridden/emptied for the in-memory backend. PostgreSQL is
  # never bundled; full mode reaches it through DATABASE_URL in .env.
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cloviela

volumes:
  redisdata:
  cloviela-data:

networks:
  cloviela:
    driver: bridge
